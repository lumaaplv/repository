    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #071e29;
            color: #f5f5ef;
            font-family: 'Nunito', sans-serif;
        }

        [hidden] {
            display: none !important;
        }

        .admin-container {
            max-width: 1050px;
            margin: 0 auto;
            padding: 40px 25px;
        }

        .admin-back {
            color: #a1ddf1;
            text-decoration: none;
            font-weight: 800;
        }

        .admin-header {
            margin: 35px 0;
        }

        .admin-header h1 {

        }

        .admin-header p {

        .admin-icon {

            border-radius: 18px;
            display: grid;

        }

        .admin-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);

        .stat-card {

            border-radius: 18px;
            padding: 20px;
        }

        .stat-card strong {
            display: block;

        .admin-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;

        }

        button {

            cursor: pointer;
        }

        .admin-tab {
            background: transparent;
            color: #a1ddf1;
            border: 1px solid #375662;
            padding: 10px 18px;
            border-radius: 25px;
            font-weight: 800;
        }

        .admin-tab.active {
            background: #a1ddf1;
            color: #092633;
        }

        .request-card {
            background: #103340;
            border: 1px solid #375662;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 18px;
            overflow-wrap: anywhere;
        }

        .request-card h3 {
            margin: 0 0 8px;
            font-size: 22px;
        }

        .request-card p {
            color: #bfd0d9;
            margin: 8px 0;
        }

        .request-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
        }

        .action {
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-weight: 800;
            color: white;
        }

        .approve {
            background: #246d51;
        }

        .reject {
            background: #943f50;
        }

        .action:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        .status-label {
            color: #a1ddf1;
            font-size: 13px;

        }

        #admin-message {
            color: #bfd0d9;
        }

        @media (max-width: 600px) {
            .admin-container {
                padding: 25px 18px;

            }

                gap: 8px;
            }

            }

                font-size: 25px;

            }

        /* COMUNICADOS OFICIAIS */

#announcement-form {

    flex-direction: column;
    gap: 12px;
}

#announcement-form > label {

}

#announcement-title,

        /* ESTATÍSTICAS DE DISTRIBUIÇÃO */

.delivery-stats {
    background: #071e29;
    border: 1px solid #375662;
    border-radius: 15px;
    padding: 18px;
    margin-top: 20px;
}

.delivery-stats h4 {

}

    background: #103340;
    border: 1px solid #375662;

    padding: 15px;
}

.delivery-channel-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 800;
}

.delivery-channel-title svg {
    width: 18px;
    height: 18px;

.delivery-channel strong {

    color: #a1ddf1;
    margin-top: 8px;
}

.delivery-channel small {
    color: #9fb9c5;
}

.delivery-totals {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));

.delivery-total {

.delivery-total strong {

.delivery-sent {

}

.delivery-pending {
    color: #f3d675;

.delivery-processing {

.delivery-failed {

}

.delivery-skipped {

.delivery-progress {

@media (max-width: 600px) {

<script>

const supabaseClient = supabase.createClient(
    "https://hyavqrkzcgubtbvkqiev.supabase.co",
    "sb_publishable_p1sVG4mt3SPX7k9JaF7nfA_5g7XBRq1"
);

let solicitacoes = [];
let statusSelecionado = "pending";

const painel = document.getElementById("admin-panel");
const mensagem = document.getElementById("admin-message");
const container = document.getElementById("requests-container");

/* VERIFICAR ACESSO ADMINISTRATIVO */

async function verificarAdmin() {

    const { data: { user }, error: authError } =
        await supabaseClient.auth.getUser();

    if (authError || !user) {
        mensagem.textContent = "Entre na sua conta administrativa.";
        return;
    }

    const { data, error } = await supabaseClient
        .from("admin_users")
        .select("user_id")
        .eq("user_id", user.id)
        .maybeSingle();

    if (error || !data) {
        mensagem.textContent = "Acesso restrito à administração da LUMA.";
        return;
    }
/* CARREGAR APARÊNCIA ADMINISTRATIVA */

try {

    const tema = await LumaTheme.carregarPreferencia(
        supabaseClient,
        user.id
    );

    LumaTheme.aplicarTema(tema || "dark");

} catch (error) {

    console.error("Erro ao carregar aparência:", error);

    LumaTheme.aplicarTema("dark");

}
    mensagem.textContent = "";
    painel.hidden = false;

    await carregarSolicitacoes();
}

/* CARREGAR SOLICITAÇÕES */

async function carregarSolicitacoes() {

    const { data, error } = await supabaseClient
        .from("professional_verification_requests")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        container.textContent = "Erro ao carregar solicitações.";
        console.error(error);
        return;
    }

    solicitacoes = data || [];

    atualizarContadores();
    renderizarSolicitacoes();
}

/* CONTADORES */

function atualizarContadores() {

    ["pending", "approved", "rejected"].forEach(function(status) {

        document.getElementById(status + "-count").textContent =
            solicitacoes.filter(item => item.status === status).length;

    });
}

/* MOSTRAR SOLICITAÇÕES */

function renderizarSolicitacoes() {

    container.replaceChildren();

    const filtradas = solicitacoes.filter(
        item => item.status === statusSelecionado
    );

    if (filtradas.length === 0) {
        container.textContent = "Nenhuma solicitação nesta categoria.";
        return;
    }

    filtradas.forEach(function(item) {

        const card = document.createElement("article");
        card.className = "request-card";

        const nome = document.createElement("h3");
        nome.textContent = item.full_name;

        const status = document.createElement("span");
        status.className = "status-label";
        status.textContent = {
            pending: "Aguardando análise",
            approved: "Verificado",
            rejected: "Recusado"
        }[item.status];

        card.append(nome, status);

        const informacoes = [
            "Profissão: " + item.profession,
            "Conselho: " + item.council_name,
            "Registro: " + item.registration_number,
            "Estado: " + item.registration_state,
            "Solicitação: " + new Date(item.created_at)
                .toLocaleDateString("pt-BR")
        ];

        informacoes.forEach(function(texto) {

            const paragrafo = document.createElement("p");
            paragrafo.textContent = texto;
            card.appendChild(paragrafo);

        });

        const acoes = document.createElement("div");
        acoes.className = "request-actions";

        if (item.status !== "approved") {

            const aprovar = document.createElement("button");
            aprovar.className = "action approve";
            aprovar.textContent = "Aprovar";

            aprovar.onclick = function() {
                alterarStatus(item.id, "approved", acoes);
            };

            acoes.appendChild(aprovar);
        }

        if (item.status !== "rejected") {

            const recusar = document.createElement("button");
            recusar.className = "action reject";

            recusar.textContent = item.status === "approved"
                ? "Revogar verificação"
                : "Recusar";

            recusar.onclick = function() {
                alterarStatus(item.id, "rejected", acoes);
            };

            acoes.appendChild(recusar);
        }

        card.appendChild(acoes);
        container.appendChild(card);

    });
}

/* APROVAR, RECUSAR OU REVOGAR */

async function alterarStatus(id, novoStatus, acoes) {

    const texto = novoStatus === "approved"
        ? "Você conferiu a identidade e o registro profissional desta pessoa?"
        : "Deseja confirmar a recusa ou revogação desta verificação?";

    if (!confirm(texto)) return;

    const botoes = acoes.querySelectorAll("button");
    botoes.forEach(botao => botao.disabled = true);

    try {

        const { data, error } = await supabaseClient
            .from("professional_verification_requests")
            .update({ status: novoStatus })
            .eq("id", id)
            .select("id")
            .single();

        if (error || !data) {
            alert("Não foi possível atualizar a solicitação.");
            return;
        }

        await carregarSolicitacoes();

    } finally {

        botoes.forEach(botao => botao.disabled = false);

    }
}

/* ABAS */

document.querySelectorAll(".admin-tab[data-status]").forEach(function(botao) {

    botao.addEventListener("click", function() {

        statusSelecionado = botao.dataset.status;

        document.querySelectorAll(".admin-tab[data-status]").forEach(function(item) {
            item.classList.toggle("active", item === botao);
        });

        renderizarSolicitacoes();

    });

});
/* COMUNICADOS OFICIAIS */

const tabVerificacoes = document.getElementById("tab-verificacoes");
const tabComunicados = document.getElementById("tab-comunicados");

const painelVerificacoes = document.getElementById("painel-verificacoes");
const painelComunicados = document.getElementById("painel-comunicados");

const formularioComunicado = document.getElementById("announcement-form");
const mensagemComunicado = document.getElementById("announcement-message");

const listaComunicados = document.getElementById("announcements-container");

let comunicadoEmEdicao = null;

/* ALTERNAR ABAS */

tabVerificacoes.addEventListener("click", function() {

    painelVerificacoes.hidden = false;
    painelComunicados.hidden = true;

    tabVerificacoes.classList.add("active");
    tabComunicados.classList.remove("active");

});

tabComunicados.addEventListener("click", async function() {

    painelVerificacoes.hidden = true;
    painelComunicados.hidden = false;

    tabVerificacoes.classList.remove("active");
    tabComunicados.classList.add("active");

    await carregarComunicados();

});

/* SALVAR COMUNICADO */

formularioComunicado.addEventListener("submit", async function(event) {

    event.preventDefault();

    const botao = formularioComunicado.querySelector(
        'button[type="submit"]'
    );

    botao.disabled = true;
    mensagemComunicado.textContent = "Salvando...";

    const parametros = {
        p_title: document.getElementById("announcement-title").value.trim(),
        p_content: document.getElementById("announcement-content").value.trim(),
        p_send_push: document.getElementById("announcement-push").checked,
        p_send_email: document.getElementById("announcement-email").checked
    };

    try {

        let resultado;

        if (comunicadoEmEdicao) {

            resultado = await supabaseClient.rpc(
                "edit_announcement",
                {
                    p_announcement_id: comunicadoEmEdicao,
                    ...parametros
                }
            );

        } else {

            resultado = await supabaseClient.rpc(
                "create_announcement",
                parametros
            );

        }

        if (resultado.error) {
            throw resultado.error;
        }

        mensagemComunicado.textContent =
            "Rascunho salvo com sucesso!";

        formularioComunicado.reset();

        comunicadoEmEdicao = null;

        botao.textContent = "Salvar rascunho";

        await carregarComunicados();

    } catch (error) {

        console.error(error);

        mensagemComunicado.textContent =
            "Não foi possível salvar o comunicado.";

    } finally {

        botao.disabled = false;

    }

});
    const botaoAtualizarComunicados =
    document.getElementById("refresh-announcements");

botaoAtualizarComunicados.addEventListener(
    "click",
    async function() {

        botaoAtualizarComunicados.disabled = true;

        try {

            await carregarComunicados();

        } finally {

            botaoAtualizarComunicados.disabled = false;

        }
    }
);
/* CARREGAR COMUNICADOS */

async function carregarComunicados() {

    listaComunicados.textContent = "Carregando comunicados...";

    const { data, error } = await supabaseClient
        .from("announcements")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        listaComunicados.textContent =
            "Erro ao carregar comunicados.";
        console.error(error);
        return;
    }
const {
    data: estatisticas,
    error: erroEstatisticas
} = await supabaseClient.rpc(
    "get_announcement_delivery_stats"
);

const estatisticasPorComunicado = new Map();

if (erroEstatisticas) {
    console.error(erroEstatisticas);
} else {
    (estatisticas || []).forEach(item => {

        if (!estatisticasPorComunicado.has(item.announcement_id)) {
            estatisticasPorComunicado.set(
                item.announcement_id,
                {}
            );
        }

        estatisticasPorComunicado
            .get(item.announcement_id)[item.channel] = item;

    });
}
    listaComunicados.replaceChildren();

    if (!data || data.length === 0) {
        listaComunicados.textContent =
            "Nenhum comunicado criado.";
        return;
    }

    data.forEach(function(item) {

        const card = document.createElement("article");
        card.className = "request-card";

        const titulo = document.createElement("h3");
        titulo.textContent = item.title;

        const status = document.createElement("span");
        status.className = "status-label";
        status.textContent = {
            draft: "Rascunho",
            published: "Publicado",
            archived: "Arquivado"
        }[item.status];

        const conteudo = document.createElement("p");
        conteudo.className = "announcement-content-preview";
        conteudo.textContent = item.content;

        const dataCriacao = document.createElement("div");
        dataCriacao.className = "announcement-date";
        dataCriacao.textContent =
            "Criado em " +
            new Date(item.created_at).toLocaleString("pt-BR");

        const canais = document.createElement("p");

        canais.textContent = "Canais selecionados: Comunidade"
            + (item.send_push ? " • Push" : "")
            + (item.send_email ? " • E-mail" : "");

        card.append(
            titulo,
            status,
            conteudo,
            dataCriacao,
            canais
        );
if (item.send_email || item.send_push) {

    if (erroEstatisticas) {

        const aviso = document.createElement("p");

        aviso.textContent =
            "Estatísticas temporariamente indisponíveis.";

        card.appendChild(aviso);

    } else {

        const dadosDistribuicao =
            estatisticasPorComunicado.get(item.id) || {};

        card.appendChild(
            criarEstatisticasDistribuicao(
                item,
                dadosDistribuicao
            )
        );

    }
}
        const acoes = document.createElement("div");
        acoes.className = "request-actions";

        if (item.status === "draft") {

            const editar = document.createElement("button");
            editar.className = "action announcement-edit";
            editar.textContent = "Editar";

            editar.onclick = function() {
                editarComunicado(item);
            };

            const publicar = document.createElement("button");
            publicar.className = "action approve";
            publicar.textContent = "Publicar";

            publicar.onclick = function() {
                alterarComunicado(
                    item.id,
                    "publish_announcement",
                    acoes
                );
            };

            acoes.append(editar, publicar);

        }

        if (item.status !== "archived") {

            const arquivar = document.createElement("button");
            arquivar.className = "action announcement-archive";
            arquivar.textContent = "Arquivar";

            arquivar.onclick = function() {
                alterarComunicado(
                    item.id,
                    "archive_announcement",
                    acoes
                );
            };

            acoes.appendChild(arquivar);

        }

        card.appendChild(acoes);
       listaComunicados.appendChild(card);

    });

    lucide.createIcons();

}
function criarEstatisticasDistribuicao(item, dados) {

    const painel = document.createElement("section");
    painel.className = "delivery-stats";

    const email = dados.email || {};
    const push = dados.push || {};

    const campos = [
        "total",
        "sent",
        "pending",
        "processing",
        "failed",
        "skipped"
    ];

    const totais = {};

    campos.forEach(campo => {
        totais[campo] =
            Number(email[campo] || 0) +
            Number(push[campo] || 0);
    });

    const porcentagem = totais.total > 0
        ? (totais.sent / totais.total) * 100
        : 0;

    function criarCanal(nome, icone, dadosCanal) {

        return `
            <div class="delivery-channel">

                <div class="delivery-channel-title">
                    <i data-lucide="${icone}"></i>
                    ${nome}
                </div>

                <strong>
                    ${Number(dadosCanal.sent || 0)}/${Number(dadosCanal.total || 0)}
                </strong>

                <small>Envios aceitos</small>

            </div>
        `;
    }

    painel.innerHTML = `

        <h4>Histórico de distribuição</h4>

        <div class="delivery-channels">

            ${item.send_email
                ? criarCanal("E-mail", "mail", email)
                : ""}

            ${item.send_push
                ? criarCanal("Push", "bell", push)
                : ""}

        </div>

        <div class="delivery-totals">

            <div class="delivery-total">
                <strong class="delivery-sent">
                    ${totais.sent}
                </strong>
                Aceitos
            </div>

            <div class="delivery-total">
                <strong class="delivery-pending">
                    ${totais.pending}
                </strong>
                Pendentes
            </div>

            <div class="delivery-total">
                <strong class="delivery-processing">
                    ${totais.processing}
                </strong>
                Processando
            </div>

            <div class="delivery-total">
                <strong class="delivery-failed">
                    ${totais.failed}
                </strong>
                Falhas
            </div>

            <div class="delivery-total">
                <strong class="delivery-skipped">
                    ${totais.skipped}
                </strong>
                Ignorados
            </div>

        </div>

        <div class="delivery-progress-label">
            ${totais.total > 0
                ? "Envios aceitos: " +
                  porcentagem.toFixed(1).replace(".", ",") + "%"
                : "Nenhum envio registrado"}
        </div>

        <div class="delivery-progress"
             role="progressbar"
             aria-label="Envios aceitos"
             aria-valuemin="0"
             aria-valuemax="100"
             aria-valuenow="${porcentagem}">

            <div class="delivery-progress-fill"
                 style="width: ${porcentagem}%">
            </div>

        </div>

    `;

    return painel;
}
/* EDITAR COMUNICADO */

function editarComunicado(item) {

    comunicadoEmEdicao = item.id;

    document.getElementById("announcement-title").value =
        item.title;

    document.getElementById("announcement-content").value =
        item.content;

    document.getElementById("announcement-push").checked =
        item.send_push;

    document.getElementById("announcement-email").checked =
        item.send_email;

    formularioComunicado.querySelector(
        'button[type="submit"]'
    ).textContent = "Salvar alterações";

    mensagemComunicado.textContent =
        "Editando rascunho.";

    formularioComunicado.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });

}

/* PUBLICAR OU ARQUIVAR */

async function alterarComunicado(id, funcao, acoes) {

    const publicando = funcao === "publish_announcement";

    const texto = publicando
        ? "Deseja publicar este comunicado oficial?"
        : "Deseja arquivar este comunicado?";

    if (!confirm(texto)) return;

    const botoes = acoes.querySelectorAll("button");

    botoes.forEach(botao => botao.disabled = true);

    try {

        const { error } = await supabaseClient.rpc(
            funcao,
            { p_announcement_id: id }
        );

        if (error) throw error;

        if (comunicadoEmEdicao === id) {

            comunicadoEmEdicao = null;
            formularioComunicado.reset();

            formularioComunicado.querySelector(
                'button[type="submit"]'
            ).textContent = "Salvar rascunho";

        }

        mensagemComunicado.textContent = publicando
            ? "Comunicado publicado com sucesso!"
            : "Comunicado arquivado com sucesso!";

        await carregarComunicados();

    } catch (error) {

        console.error(error);

        mensagemComunicado.textContent =
            "Não foi possível concluir a operação.";

    } finally {

        botoes.forEach(botao => botao.disabled = false);

    }

}
